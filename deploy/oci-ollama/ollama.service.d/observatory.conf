[Service]
# Ollama must never listen on a public interface. Caddy is the only listener
# that can reach it, over loopback.
Environment="OLLAMA_HOST=127.0.0.1:11434"
# Conservative CPU/RAM safeguards for a small ARM64 inference VM.
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_MAX_QUEUE=4"
Restart=on-failure
RestartSec=5
